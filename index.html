<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shezan & Anam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Great+Vibes&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0a1712;
    --emerald:#0e4a30;
    --emerald-2:#146b46;
    --navy:#0f2036;
    --navy-2:#17304f;
    --burgundy:#4a1620;
    --burgundy-2:#631f2c;
    --gold:#8b6b28;
    --gold-bright:#c2984a;
    --ivory:#f8f3e6;
    --ivory-dim:#d6c9a8;
    --line: rgba(139,107,40,0.3);
    --serif: 'Fraunces', serif;
    --script: 'Great Vibes', cursive;
    --sans: 'Work Sans', sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--ink);
    color:var(--ivory);
    font-family:var(--sans);
    font-weight:300;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--gold); color:var(--ink); }

  .progress{
    position:fixed; top:0; left:0; height:2px; background:var(--gold);
    width:0%; z-index:200; transition:width .1s linear;
  }

  h1,h2,h3,.serif{ font-family:var(--serif); font-weight:400; letter-spacing:0.01em; }

  .wrap{ max-width:1080px; margin:0 auto; padding:0 28px; }
  section{ position:relative; }

  /* ---------- Motifs ---------- */
  .arch-motif{ display:block; margin:0 auto; opacity:0.9; }
  .divider{ display:flex; justify-content:center; padding: 64px 0 8px; }
  .divider svg{ width:64px; height:64px; }

  /* ---------- Hero (opening screen) ---------- */
  .hero{
    position:relative; overflow:hidden;
    min-height:100svh;
    display:flex; flex-direction:column; justify-content:flex-end; align-items:center;
    padding: 0 0 90px;
    text-align:center;
    background: var(--ink);
  }
  .hero-photo{
    position:absolute; inset:-3%; z-index:-1;
    width:106%; height:106%;
    object-fit:cover; object-position:center;
    background-image: var(--hero-photo);
    background-size:cover; background-position:center;
    animation: kenburns 20s ease-in-out infinite alternate;
  }
  @keyframes kenburns{ from{ transform:scale(1); } to{ transform:scale(1.09); } }

  .hero-tint{
    position:absolute; inset:0; z-index:0;
    background: linear-gradient(180deg, rgba(6,8,7,0.5) 0%, rgba(6,8,7,0.05) 32%, rgba(6,8,7,0.35) 66%, rgba(6,8,7,0.94) 100%);
  }
  .hero .wrap{ position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; }

  .monogram{
    position:relative; width:172px; margin:0 auto 18px;
    opacity:0; transform: scale(0.35) rotate(-14deg);
    transition: opacity 1.1s cubic-bezier(.34,1.56,.64,1), transform 1.3s cubic-bezier(.34,1.56,.64,1);
  }
  .hero.reveal-motion .monogram{ opacity:1; transform:scale(1) rotate(0deg); }
  .monogram svg{ width:100%; height:auto; display:block; }
  .monogram .sparkle{ animation: gem-shine 2.6s ease-in-out infinite; transform-origin:center; }
  .monogram .sparkle.s2{ animation-delay: .9s; }
  @keyframes gem-shine{ 0%,100%{ opacity:0.55; transform:scale(0.9); } 50%{ opacity:1; transform:scale(1.05); } }

  .hero-names-script{
    font-family:var(--script); font-weight:400;
    font-size:clamp(46px, 10vw, 90px);
    line-height:1.15;
    color:var(--ivory);
    text-shadow: 0 2px 20px rgba(0,0,0,0.5);
    opacity:0; filter:blur(16px); transform:scale(1.14) translateY(20px);
    transition: opacity 1.2s ease .3s, filter 1.2s ease .3s, transform 1.2s cubic-bezier(.16,.84,.44,1) .3s;
  }
  .hero.reveal-motion .hero-names-script{ opacity:1; filter:blur(0); transform:scale(1) translateY(0); }
  .hero-names-script .amp-script{
    font-family:var(--sans); font-size:0.34em; vertical-align:0.3em;
    color:var(--gold-bright); margin:0 10px; letter-spacing:0.1em;
  }
  .hero-names-script .cap{
    font-family:'Fraunces', serif; font-style:italic; font-weight:500;
    font-size:0.86em;
  }

  @media (prefers-reduced-motion: reduce){
    .hero-photo{ animation:none !important; }
    .monogram,.hero-names-script,.scroll-cue,.reveal,.flash-in{ transition:none !important; opacity:1 !important; transform:none !important; filter:none !important; animation:none !important; }
  }

  .scroll-cue{
    margin-top:34px; font-size:12px; color:var(--ivory-dim); letter-spacing:0.1em; display:flex; align-items:center; gap:10px;
    opacity:0; transition: opacity .8s ease .95s;
  }
  .hero.reveal-motion .scroll-cue{ opacity:1; }
  .scroll-cue .ln{ width:28px; height:1px; background:var(--gold); display:inline-block; }

  /* ---------- Reveal on scroll ---------- */
  .reveal{ opacity:0; transform:translateY(22px); transition:opacity .8s ease, transform .8s ease; }
  .reveal.in{ opacity:1; transform:translateY(0); }

  /* ---------- Flash-in: for titles, kickers, and gold/bold standout text ---------- */
  .flash-in{
    opacity:0; transform:translateY(14px);
    transition: opacity .7s ease, transform .7s ease;
  }
  .flash-in.in{
    opacity:1; transform:translateY(0);
    animation: flash-glow 1.3s ease-out;
  }
  @keyframes flash-glow{
    0%{ filter: brightness(1) drop-shadow(0 0 0 rgba(194,152,74,0)); }
    40%{ filter: brightness(1.3) drop-shadow(0 0 12px rgba(194,152,74,0.55)); }
    100%{ filter: brightness(1) drop-shadow(0 0 0 rgba(194,152,74,0)); }
  }

  /* ---------- Invitation statement ---------- */
  .intro{ padding:110px 0; background:var(--ink); text-align:center; }
  .bismillah{
    font-family:'Amiri', serif; font-size:clamp(24px,4vw,34px);
    color:var(--gold-bright); margin-bottom:20px; line-height:1.9;
  }
  .verse-arabic{
    font-family:'Amiri', serif; font-size:clamp(22px,3.4vw,30px);
    color:var(--gold); margin-bottom:10px;
  }
  .verse-translation{
    font-style:italic; font-size:14.5px; color:var(--ivory-dim);
    letter-spacing:0.03em; margin-bottom:40px;
  }
  .dear-guests{
    font-family:var(--script); font-weight:400;
    font-size:clamp(38px,6.5vw,58px); color:var(--ivory);
    margin-bottom:26px;
  }
  .intro p{ font-family:var(--serif); font-size:clamp(18px,2.3vw,22px); line-height:1.85; max-width:600px; margin:0 auto 28px; color:var(--ivory-dim); font-weight:300; }
  .invite-names-stack{ margin-bottom:30px; }
  .invite-names-big{
    font-family:var(--serif); font-style:italic; font-weight:500;
    font-size:clamp(30px,5vw,48px); color:var(--gold-bright);
    line-height:1.3;
  }
  .invite-amp{
    font-family:var(--script); font-weight:400;
    font-size:clamp(22px,3.4vw,32px); color:var(--gold);
    line-height:1.4;
  }

  /* ---------- Save the date ---------- */
  .save-date{ padding:100px 0; background:var(--ink); text-align:center; }
  .save-date .kicker{ font-size:13px; color:var(--gold-bright); letter-spacing:0.12em; margin-bottom:18px; }
  .cal-month{ font-family:var(--serif); font-size:clamp(28px,4.4vw,42px); color:var(--ivory); margin-bottom:34px; }
  .cal-month .cal-year{ font-style:italic; color:var(--gold-bright); }
  .cal-grid{
    display:grid; grid-template-columns:repeat(7,1fr); gap:6px;
    max-width:400px; margin:0 auto;
  }
  .cal-wd{ font-size:11px; letter-spacing:0.06em; color:var(--gold-bright); padding-bottom:10px; }
  .cal-cell{
    aspect-ratio:1; display:flex; align-items:center; justify-content:center;
    font-family:var(--serif); font-size:14px; color:var(--ivory-dim); border-radius:50%;
  }
  .cal-cell.empty{ visibility:hidden; }
  .cal-cell.highlight{ background:var(--gold); color:var(--ink); font-weight:600; }
  .cal-legend{ margin-top:38px; display:flex; flex-direction:column; gap:12px; align-items:center; }
  .legend-item{ font-size:14.5px; color:var(--ivory-dim); display:flex; align-items:center; gap:10px; }
  .legend-item .dot{ width:8px; height:8px; border-radius:50%; background:var(--gold); display:inline-block; flex-shrink:0; }

  /* ---------- Events ---------- */
  .events{ padding: 40px 0 60px; }
  .event-card{
    border:1px solid var(--line); border-radius:2px; overflow:hidden; margin: 0 0 26px;
  }
  .event-top{
    display:grid; grid-template-columns: 0.9fr 1.4fr; gap:0;
  }
  .event-card .panel-a{
    padding:44px 38px; display:flex; flex-direction:column; justify-content:center; gap:14px;
    position:relative;
  }
  .event-card .panel-b{
    padding:44px 38px; display:flex; flex-direction:column; justify-content:center; gap:18px;
    background: rgba(0,0,0,0.14);
  }
  .event-card.nikkah .panel-a{ background: linear-gradient(160deg, var(--navy), var(--navy-2)); }
  .event-card.mehndi .panel-a{ background: linear-gradient(160deg, var(--burgundy), var(--burgundy-2)); }
  .event-card.wedding .panel-a{ background: linear-gradient(160deg, var(--emerald), var(--emerald-2)); }

  .route-block{ padding:32px 38px; border-top:1px solid var(--line); background:rgba(255,255,255,0.015); }
  .route-kicker{ font-size:12px; letter-spacing:0.1em; color:var(--gold-bright); margin-bottom:20px; }
  .route-info{ font-size:14px; color:var(--ivory-dim); margin:-8px 0 22px; max-width:420px; line-height:1.6; }
  .route-steps{ display:flex; flex-direction:column; gap:0; }
  .route-step{ display:flex; gap:14px; align-items:flex-start; }
  .route-step .dot{ width:10px; height:10px; border-radius:50%; background:var(--gold); margin-top:6px; flex-shrink:0; }
  .route-step .rs-label{ font-family:var(--serif); font-size:16px; color:var(--ivory); }
  .route-step .rs-addr{ font-size:12.5px; color:var(--ivory-dim); line-height:1.5; margin-top:2px; }
  .route-arrow{ margin:2px 0 2px 4px; color:var(--gold); font-size:15px; line-height:1; opacity:0.85; }
  .route-btns{ display:flex; gap:14px; flex-wrap:wrap; margin-top:26px; }
  .route-btn{
    display:inline-flex; align-items:center; gap:8px; padding:12px 22px;
    border:1px solid var(--gold); border-radius:20px; color:var(--gold-bright); text-decoration:none;
    font-size:13px; transition:all .2s ease;
  }
  .route-btn:hover{ background:var(--gold); color:var(--ink); }

  .itinerary-block{ padding:36px 38px 32px; border-top:1px solid var(--line); }
  .itinerary-kicker{ font-size:12px; letter-spacing:0.1em; color:var(--gold-bright); margin-bottom:24px; }
  .itin-main{ display:flex; flex-direction:column; }
  .itin-row{ display:grid; grid-template-columns:78px 20px 1fr; align-items:start; }
  .itin-time{ font-family:var(--serif); font-size:17px; color:var(--gold-bright); padding-top:1px; }
  .itin-track{ position:relative; display:flex; justify-content:center; align-self:stretch; }
  .itin-dot{ width:11px; height:11px; border-radius:50%; background:var(--gold); margin-top:6px; flex-shrink:0; }
  .itin-track::before{ content:''; position:absolute; top:22px; bottom:-6px; width:1px; background:var(--line); left:50%; }
  .itin-row:last-child .itin-track::before{ display:none; }
  .itin-label{ font-size:16.5px; color:var(--ivory); padding:2px 0 26px; }
  .itin-row:last-child .itin-label{ padding-bottom:0; }

  .itin-after{ margin-top:30px; padding-top:24px; border-top:1px solid var(--line); }
  .itin-after-label{ font-size:11px; letter-spacing:0.1em; color:var(--gold-bright); display:block; margin-bottom:10px; }
  .itin-after-list{ font-size:13.5px; color:var(--ivory-dim); line-height:1.9; }
  .itin-after-list .sep{ color:var(--line); margin:0 8px; }

  .itin-note{ margin-top:22px; font-size:14.5px; color:var(--gold-bright); font-style:italic; }

  .event-tag{ font-size:12px; letter-spacing:0.12em; color:var(--gold-bright); }
  .event-title{ font-size:clamp(28px,3.6vw,42px); color:var(--ivory); }
  .event-note{ font-size:14px; color:var(--ivory-dim); max-width:280px; line-height:1.6; }

  .event-field{ display:flex; flex-direction:column; gap:4px; }
  .event-field .f-lbl{ font-size:11px; letter-spacing:0.1em; color:var(--gold-bright); }
  .event-field .f-val{ font-family:var(--serif); font-size:19px; color:var(--ivory); }
  .event-field .f-sub{ font-size:13px; color:var(--ivory-dim); }

  .cal-link{
    display:inline-flex; align-items:center; gap:8px; margin-top:6px;
    font-size:13px; color:var(--gold-bright); text-decoration:none; border-bottom:1px solid var(--line); padding-bottom:2px; width:fit-content;
  }
  .cal-link:hover{ color:var(--gold); border-color:var(--gold); }

  @media (max-width: 760px){
    .event-top{ grid-template-columns: 1fr; }
  }

  /* ---------- Details ---------- */
  .details{ padding:90px 0 40px; }
  .details-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:28px; margin-top:44px; }
  .detail-box{ border-top:1px solid var(--line); padding-top:20px; }
  .detail-box h3{ font-size:20px; color:var(--gold-bright); margin-bottom:10px; font-weight:400; }
  .detail-box p{ font-size:14.5px; line-height:1.7; color:var(--ivory-dim); }
  @media (max-width:700px){ .details-grid{ grid-template-columns:1fr; } }

  /* ---------- Gallery ---------- */
  .gallery{ padding:90px 0; }
  .gallery-grid{
    display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-top:40px;
  }
  .g-tile{
    aspect-ratio:3/4; border:1px solid var(--line); border-radius:2px;
    display:flex; align-items:center; justify-content:center;
    background: linear-gradient(145deg, rgba(139,107,40,0.06), rgba(255,255,255,0.02));
    color:var(--ivory-dim); font-size:12px; text-align:center; padding:10px;
  }
  .g-tile:nth-child(3n+1){ background: linear-gradient(145deg, rgba(30,69,54,0.35), rgba(255,255,255,0.02)); }
  .g-tile:nth-child(3n+2){ background: linear-gradient(145deg, rgba(99,31,44,0.30), rgba(255,255,255,0.02)); }
  @media (max-width:760px){ .gallery-grid{ grid-template-columns:repeat(2,1fr); } }

  /* ---------- RSVP ---------- */
  .rsvp{ padding:90px 0 60px; }
  .rsvp-card{
    border:1px solid var(--line); border-radius:2px; padding:44px 36px; background:rgba(255,255,255,0.02);
    max-width:720px;
  }
  .rsvp-event-row{ display:flex; justify-content:space-between; align-items:center; padding:16px 0; border-bottom:1px solid var(--line); gap:16px; flex-wrap:wrap; }
  .rsvp-event-row .name{ font-family:var(--serif); font-size:19px; }
  .toggle-group{ display:flex; gap:8px; }
  .toggle{
    padding:8px 18px; border:1px solid var(--line); border-radius:20px; background:transparent; color:var(--ivory-dim);
    font-family:var(--sans); font-size:13px; cursor:pointer; transition:all .2s ease;
  }
  .toggle.active-yes{ background:var(--gold); color:var(--ink); border-color:var(--gold); }
  .toggle.active-no{ background:rgba(139,107,40,0.12); color:var(--gold-bright); border-color:var(--gold); }

  .form-row{ margin-top:22px; display:flex; flex-direction:column; gap:8px; }
  .form-row label{ font-size:11px; letter-spacing:0.1em; color:var(--gold-bright); }
  .form-row input, .form-row textarea, .form-row select{
    background:transparent; border:none; border-bottom:1px solid var(--line);
    color:var(--ivory); font-family:var(--sans); font-size:16px; padding:8px 2px; outline:none;
  }
  .form-row input:focus, .form-row textarea:focus, .form-row select:focus{ border-color:var(--gold); }
  .form-row select option{ background:var(--ink); color:var(--ivory); }
  .form-two{ display:grid; grid-template-columns:1fr 1fr; gap:22px; }
  @media (max-width:600px){ .form-two{ grid-template-columns:1fr; } }

  .submit-btn{
    margin-top:32px; padding:15px 34px; background:var(--gold); color:var(--ink); border:none; border-radius:2px;
    font-family:var(--sans); font-weight:500; font-size:14px; letter-spacing:0.04em; cursor:pointer; transition:background .2s ease;
  }
  .submit-btn:hover{ background:var(--gold-bright); }
  .submit-btn:disabled{ opacity:0.5; cursor:default; }

  .rsvp-msg{ margin-top:18px; font-size:14px; color:var(--gold-bright); min-height:20px; }

  .thanks{ text-align:center; padding:40px 0; }
  .thanks h3{ font-size:30px; color:var(--gold-bright); }
  .thanks p{ color:var(--ivory-dim); margin-top:12px; font-size:15px; }
  .again-btn{ margin-top:22px; background:none; border:1px solid var(--line); color:var(--ivory-dim); padding:10px 20px; border-radius:20px; font-size:13px; cursor:pointer; }

  /* ---------- Countdown ---------- */
  .countdown{ padding:90px 0 100px; text-align:center; background:var(--ink); }
  .countdown .kicker{ font-size:13px; color:var(--gold-bright); letter-spacing:0.12em; margin-bottom:8px; }
  .countdown-sub{ font-size:14.5px; color:var(--ivory-dim); margin-bottom:8px; }
  .countdown-date{ font-family:var(--serif); font-size:18px; color:var(--gold-bright); margin-bottom:44px; }
  .countdown-row{ display:flex; justify-content:center; gap:clamp(16px,4vw,44px); flex-wrap:wrap; }
  .countdown-unit{ display:flex; flex-direction:column; align-items:center; min-width:64px; }
  .countdown-num{ font-family:var(--serif); font-size:clamp(36px,7vw,58px); color:var(--gold-bright); line-height:1; font-variant-numeric:tabular-nums; }
  .countdown-label{ margin-top:10px; font-size:11px; letter-spacing:0.12em; color:var(--ivory-dim); }
  .countdown-arrived{ font-family:var(--script); font-size:clamp(34px,6vw,52px); color:var(--gold-bright); }

  /* ---------- Footer ---------- */
  footer{ padding:70px 0 50px; text-align:center; border-top:1px solid var(--line); margin-top:40px; }
  footer .fname{ font-family:var(--serif); font-size:22px; color:var(--gold-bright); }
  footer p{ margin-top:10px; font-size:12.5px; color:var(--ivory-dim); letter-spacing:0.06em; }

  /* ---------- Gate (no valid invite code) ---------- */
  .gate{ min-height:100svh; display:flex; align-items:center; justify-content:center; text-align:center; padding:40px; }
  .gate h1{ font-size:clamp(28px,5vw,44px); }
  .gate p{ margin-top:16px; color:var(--ivory-dim); max-width:420px; }

  /* ---------- Admin ---------- */
  .admin-wrap{ max-width:960px; margin:60px auto; padding:0 24px; }
  .admin-table{ width:100%; border-collapse:collapse; margin-top:24px; font-size:13.5px; }
  .admin-table th, .admin-table td{ border-bottom:1px solid var(--line); padding:10px 8px; text-align:left; vertical-align:top; }
  .admin-table th{ color:var(--gold-bright); font-weight:500; font-size:11px; letter-spacing:0.08em; }
  .admin-summary{ display:flex; gap:30px; margin-top:20px; flex-wrap:wrap; }
  .admin-summary div{ border:1px solid var(--line); padding:14px 20px; border-radius:2px; }
  .admin-summary .n{ font-family:var(--serif); font-size:28px; color:var(--gold-bright); }
  .admin-summary .l{ font-size:11px; color:var(--ivory-dim); letter-spacing:0.08em; margin-top:4px; }
  .admin-login{ min-height:100svh; display:flex; align-items:center; justify-content:center; }
  .admin-login input{ background:transparent; border:1px solid var(--line); color:var(--ivory); padding:12px 16px; font-size:15px; border-radius:2px; }
  .admin-login button{ margin-left:10px; }

  /* ---------- Envelope gate ---------- */
  #app{ transition: opacity 1.1s ease .35s; }
  #app.gated{ opacity:0; pointer-events:none; }

  #envelopeGate{
    position:fixed; inset:0; z-index:500; background:var(--ink);
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    cursor:pointer; overflow:hidden;
    transition: opacity .8s ease, visibility .8s ease;
  }
  #envelopeGate.fading{ opacity:0; visibility:hidden; pointer-events:none; }

  #envelopeGate::before{
    content:''; position:absolute; inset:0; pointer-events:none;
    background: radial-gradient(circle at 50% 55%, rgba(194,152,74,0) 0%, transparent 60%);
    opacity:0; transition: opacity 1s ease, background 1s ease;
  }
  #envelopeGate.opening::before{
    opacity:1;
    background: radial-gradient(circle at 50% 55%, rgba(194,152,74,0.38) 0%, transparent 66%);
  }

  .env-shimmer{
    position:absolute; top:0; left:-35%; width:26%; height:100%;
    background: linear-gradient(100deg, transparent, rgba(194,152,74,0.22), transparent);
    transform: skewX(-20deg); opacity:0; pointer-events:none;
  }
  #envelopeGate.opening .env-shimmer{ animation: shimmer-sweep 1.3s ease forwards; }
  @keyframes shimmer-sweep{ 0%{ left:-35%; opacity:0; } 15%{ opacity:1; } 100%{ left:130%; opacity:0; } }

  .env-box{ position:relative; width:min(300px, 78vw); height:min(210px, 55vw); perspective:1000px; }

  .env-card{
    position:absolute; left:50%; top:50%; width:76%; height:66%;
    background: linear-gradient(155deg, var(--ivory), #ddc794);

/* =========================================================
   RSVP state + submission
   ========================================================= */
const rsvpChoices = {};
function setRsvpChoice(key, val){
  rsvpChoices[key] = val;
  const group = document.querySelector(`.toggle-group[data-group="${key}"]`);
  if(!group) return;
  group.querySelectorAll('.toggle').forEach(btn => {
    btn.classList.remove('active-yes','active-no');
    if(btn.dataset.val === val){
      btn.classList.add(val === 'yes' ? 'active-yes' : 'active-no');
    }
  });
}

async function submitRsvp(){
  const out = document.getElementById('rsvpMsgOut');
  const name = document.getElementById('rsvpName').value.trim();
  const count = document.getElementById('rsvpCount').value;

  if(!name){ out.textContent = 'Please add your name.'; return; }
  if(allowed.some(k => !rsvpChoices[k])){ out.textContent = 'Please respond to each event above.'; return; }

  const btn = document.getElementById('rsvpSubmit');
  btn.disabled = true;
  out.textContent = 'Sending...';

  const record = {
    id: 'rsvp_' + Date.now() + '_' + Math.random().toString(36).slice(2,8),
    name, count,
    responses: {...rsvpChoices},
    invCode: invParam,
    submittedAt: new Date().toISOString()
  };

  try{
    const res = await window.storage.set('rsvp:' + record.id, JSON.stringify(record), true);
    if(!res){ out.textContent = 'Something went wrong — please try again.'; btn.disabled = false; return; }
    showThanks();
  }catch(err){
    out.textContent = 'Something went wrong — please try again.';
    btn.disabled = false;
  }
}

function showThanks(){
  const area = document.getElementById('rsvpArea');
  area.innerHTML = `
    <div class="thanks">
      <h3 class="serif">Thank you</h3>
      <p>Your RSVP has been received. We can't wait to celebrate with you.</p>
      <button class="again-btn" onclick="location.reload()">Submit another response</button>
    </div>`;
}

/* =========================================================
   Calendar link helper
   ========================================================= */
function scriptName(name){
  return `<span class="cap">${name.charAt(0)}</span>${name.slice(1)}`;
}

function icsEscape(s){
  return String(s || '').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
}
function toICSDate(dateStr){
  const d = new Date(dateStr);
  const pad = n => n < 10 ? '0'+n : ''+n;
  return d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()) + 'T' + pad(d.getHours()) + pad(d.getMinutes()) + '00';
}
function buildICSContent(e){
  const loc = e.city ? `${e.venue}, ${e.city}` : e.venue;
  const end = e.end || e.date;
  const lines = [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//Shezan and Anam Wedding//EN',
    'BEGIN:VEVENT',
    'UID:' + e.key + '-' + Date.now() + '@wedding',
    'DTSTAMP:' + toICSDate(new Date().toISOString()),
    'DTSTART:' + toICSDate(e.date),
    'DTEND:' + toICSDate(end),
    'SUMMARY:' + icsEscape(e.title),
    'LOCATION:' + icsEscape(loc),
    'DESCRIPTION:' + icsEscape(e.note || ''),
    'END:VEVENT',
    'END:VCALENDAR'
  ];
  return lines.join('\r\n');
}

function downloadICS(eventKey){
  const e = CONFIG.events[eventKey];
  if(!e || !e.date) return;
  try{
    const content = buildICSContent(e);
    const blob = new Blob([content], { type: 'text/calendar;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = eventKey + '.ics';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }catch(err){
    console.error(err);
  }
}

function buildRouteLink(route){
  if(!route || route.length < 1) return null;
  const enc = s => encodeURIComponent(s);
  const destination = enc(route[route.length-1].address);
  const mid = route.slice(0,-1).map(r => enc(r.address)).join('|');
  let url = `https://www.google.com/maps/dir/?api=1&destination=${destination}&travelmode=driving`;
  if(mid) url += `&waypoints=${mid}`;
  return url;
}

/* =========================================================
   Scroll reveal + progress bar
   ========================================================= */
function initCountdown(){
  const display = document.getElementById('countdownDisplay');
  if(!display) return;
  const w = CONFIG.events.wedding;
  // Anchored to UK time (BST, UTC+1 in October) so the countdown is accurate
  // for guests viewing from any timezone, not just the viewer's local clock.
  const targetStr = w.date ? `${w.date}+01:00` : `2026-10-${String(w.day).padStart(2,'0')}T00:00:00+01:00`;
  const target = new Date(targetStr).getTime();
  let timer;

  function render(){
    const now = Date.now();
    const diff = target - now;
    if(diff <= 0){
      display.innerHTML = `<div class="countdown-arrived">The day has arrived!</div>`;
      clearInterval(timer);
      return;
    }
    const d = Math.floor(diff / 86400000);
    const h = Math.floor((diff % 86400000) / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);
    display.innerHTML = `
      <div class="countdown-row">
        <div class="countdown-unit"><div class="countdown-num">${d}</div><div class="countdown-label">DAYS</div></div>
        <div class="countdown-unit"><div class="countdown-num">${String(h).padStart(2,'0')}</div><div class="countdown-label">HOURS</div></div>
        <div class="countdown-unit"><div class="countdown-num">${String(m).padStart(2,'0')}</div><div class="countdown-label">MINS</div></div>
        <div class="countdown-unit"><div class="countdown-num">${String(s).padStart(2,'0')}</div><div class="countdown-label">SECS</div></div>
      </div>`;
  }

  render();
  timer = setInterval(render, 1000);
}

function setupScrollEffects(){
  const bar = document.getElementById('progressBar');
  window.addEventListener('scroll', () => {
    const h = document.documentElement;
    const pct = (h.scrollTop) / (h.scrollHeight - h.clientHeight) * 100;
    bar.style.width = pct + '%';
  });

  const io = new IntersectionObserver((entries) => {
    entries.forEach(en => { if(en.isIntersecting) en.target.classList.add('in'); });
  }, { threshold: 0.15 });
  document.querySelectorAll('.reveal, .flash-in').forEach(el => io.observe(el));
}

/* =========================================================
   ADMIN DASHBOARD
   ========================================================= */
function renderAdminLogin(){
  app.innerHTML = `
    <div class="admin-login">
      <div>
        <p style="color:var(--ivory-dim); margin-bottom:10px; font-size:13px;">Enter passcode</p>
        <input id="adminPass" type="password" />
        <button class="submit-btn" onclick="checkAdminPass()" style="padding:12px 20px;">Enter</button>
      </div>
    </div>`;
}

function checkAdminPass(){
  const val = document.getElementById('adminPass').value;
  if(val === CONFIG.adminPasscode){ renderAdminDashboard(); }
  else{ document.getElementById('adminPass').style.borderColor = 'var(--burgundy-2)'; }
}

async function renderAdminDashboard(){
  app.innerHTML = `<div class="admin-wrap"><p class="serif" style="font-size:24px;">Loading RSVPs…</p></div>`;
  let keys = [];
  try{
    const listRes = await window.storage.list('rsvp:', true);
    keys = (listRes && listRes.keys) || [];
  }catch(err){ keys = []; }

  const records = [];
  for(const k of keys){
    try{
      const r = await window.storage.get(k, true);
      if(r && r.value) records.push(JSON.parse(r.value));
    }catch(err){ /* skip */ }
  }

  records.sort((a,b) => new Date(b.submittedAt) - new Date(a.submittedAt));

  const totals = { nikkah:0, mehndi:0, wedding:0 };
  records.forEach(r => {
    CONFIG.order.forEach(k => {
      if(r.responses && r.responses[k] === 'yes') totals[k] += parseInt(r.count || 1, 10) || 1;
    });
  });

  const rows = records.map(r => `
    <tr>
      <td>${r.name}</td>
      <td>${CONFIG.order.filter(k => r.responses && r.responses[k]).map(k => `${CONFIG.events[k].tag}: ${r.responses[k]==='yes'?'Yes':'No'}`).join('<br>')}</td>
      <td>${r.count}</td>
      <td>${new Date(r.submittedAt).toLocaleString()}</td>
    </tr>`).join('');

  app.innerHTML = `
    <div class="admin-wrap">
      <h1 class="serif" style="font-size:32px;">RSVP Dashboard</h1>
      <div class="admin-summary">
        <div><div class="n">${records.length}</div><div class="l">RESPONSES</div></div>
        <div><div class="n">${totals.nikkah}</div><div class="l">NIKKAH GUESTS</div></div>
        <div><div class="n">${totals.mehndi}</div><div class="l">MEHNDI GUESTS</div></div>
        <div><div class="n">${totals.wedding}</div><div class="l">WEDDING GUESTS</div></div>
      </div>
      <table class="admin-table">
        <thead><tr><th>Name</th><th>Responses</th><th>Count</th><th>Submitted</th></tr></thead>
        <tbody>${rows || '<tr><td colspan="4" style="color:var(--ivory-dim);">No responses yet.</td></tr>'}</tbody>
      </table>
    </div>`;
}

/* =========================================================
   ENVELOPE GATE — the entry ritual before the site is revealed
   ========================================================= */
function renderEnvelope(){
  const overlay = document.createElement('div');
  overlay.id = 'envelopeGate';
  overlay.innerHTML = `
    <div class="env-shimmer"></div>
    <div class="env-box">
      <div class="env-card">S &amp; A</div>
      <div class="env-back"></div>
      <div class="env-flap"></div>
      <div class="env-seal-wrap">
        <div class="env-seal-half left">S&amp;A</div>
        <div class="env-seal-half right">S&amp;A</div>
        <div class="env-sparkles" id="envSparkles"></div>
      </div>
    </div>
    <div class="env-prompt">Tap to open</div>
  `;
  overlay.addEventListener('click', openEnvelope, { once: true });
  document.body.appendChild(overlay);
}

function spawnSparkles(){
  const container = document.getElementById('envSparkles');
  if(!container) return;
  const n = 16;
  for(let i = 0; i < n; i++){
    const s = document.createElement('span');
    s.className = 'spark';
    const angle = (Math.PI * 2 * i) / n + (Math.random() * 0.3 - 0.15);
    const dist = 46 + Math.random() * 54;
    s.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
    s.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
    s.style.animationDelay = (Math.random() * 90) + 'ms';
    container.appendChild(s);
  }
}

function openEnvelope(){
  const overlay = document.getElementById('envelopeGate');
  const appEl = document.getElementById('app');
  const heroEl = appEl.querySelector('.hero');

  overlay.classList.add('cracking');
  spawnSparkles();

  setTimeout(() => overlay.classList.add('opening'), 380);
  setTimeout(() => appEl.classList.remove('gated'), 950);
  setTimeout(() => { if (heroEl) heroEl.classList.add('reveal-motion'); }, 1500);
  setTimeout(() => overlay.classList.add('fading'), 1650);
  setTimeout(() => overlay.remove(), 2450);
}

/* =========================================================
   BOOT
   ========================================================= */
if(isAdmin){
  renderAdminLogin();
} else if(allowed.length === 0){
  renderGate();
} else {
  app.classList.add('gated');
  renderSite();
  renderEnvelope();
}
