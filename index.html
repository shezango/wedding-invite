<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shezan & Anam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Great+Vibes&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0a1712;
    --emerald:#177a4f;
    --emerald-2:#1f9463;
    --navy:#1e3a5f;
    --navy-2:#2c5486;
    --burgundy:#7a2632;
    --burgundy-2:#9c3c4a;
    --plum:#5b2a52;
    --plum-2:#7d3d72;
    --gold:#8b6b28;
    --gold-bright:#c2984a;
    --ivory:#f8f3e6;
    --ivory-dim:#d6c9a8;
    --canvas:#f8f3e8;
    --canvas-2:#f1e9d8;
    --text-dark:#1c2e24;
    --text-dark-dim:#5c6f61;
    --line: rgba(139,107,40,0.3);
    --line-dark: rgba(28,46,36,0.18);
    --serif: 'Fraunces', serif;
    --script: 'Great Vibes', cursive;
    --sans: 'Work Sans', sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth; overflow-x:hidden;}
  body{
    background:var(--canvas);
    color:var(--text-dark);
    font-family:var(--sans);
    font-weight:300;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--gold); color:var(--canvas); }

  .progress{
    position:fixed; top:0; left:0; height:2px; background:var(--gold);
    width:0%; z-index:200; transition:width .1s linear;
  }

  h1,h2,h3,.serif{ font-family:var(--serif); font-weight:400; letter-spacing:0.01em; }

  .wrap{ max-width:1080px; margin:0 auto; padding:0 28px; }
  section{ position:relative; }

  /* ---------- Motifs ---------- */
  .arch-motif{ display:block; margin:0 auto; opacity:0.9; }
  .divider{ display:flex; justify-content:center; padding: 64px 0 8px; }
  .divider svg{ width:64px; height:64px; }
  .divider.paisley svg{ width:180px; height:58px; }

  /* ---------- Confetti atmosphere (sits BEHIND content) ---------- */
  #confettiField{ position:fixed; inset:0; z-index:1; pointer-events:none; overflow:hidden; }
  .confetti-piece{
    position:absolute; top:-6%; opacity:0.7; filter: blur(0.3px) drop-shadow(0 2px 4px rgba(0,0,0,0.3));
    animation: confetti-fall var(--dur) linear var(--delay) infinite;
  }
  .confetti-piece .cf-inner{
    width:100%; height:100%; display:block;
    animation: confetti-flip var(--flipdur) linear infinite;
    transform-style: preserve-3d;
  }
  @keyframes confetti-fall{
    0%{ transform: translateY(-6vh) translateX(0); opacity:0; }
    6%{ opacity:0.7; }
    25%{ transform: translateY(25vh) translateX(var(--sway)); }
    50%{ transform: translateY(50vh) translateX(calc(var(--sway) * -1)); }
    75%{ transform: translateY(75vh) translateX(var(--sway)); }
    94%{ opacity:0.7; }
    100%{ transform: translateY(110vh) translateX(0); opacity:0; }
  }
  @keyframes confetti-flip{
    0%{ transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg); }
    100%{ transform: rotateX(360deg) rotateY(220deg) rotateZ(180deg); }
  }

  .autumn-branch{ position:absolute; width:78px; height:78px; pointer-events:none; z-index:-1; opacity:0.75; }
  .autumn-branch.tr{ top:0; right:0; }
  .autumn-branch.bl{ bottom:0; left:0; transform:rotate(180deg); }
  .autumn-branch.tl{ top:0; left:0; transform:scaleX(-1); }

  /* ---------- Hero (opening screen) ---------- */
  .hero{
    position:relative; z-index:0; overflow:hidden;
    min-height:100svh;
    display:flex; flex-direction:column; justify-content:flex-end; align-items:center;
    padding: 0 0 260px;
    text-align:center;
    background: var(--ink);
  }
  .hero-photo{
    position:absolute; inset:-3%; z-index:-1;
    width:106%; height:106%;
    object-fit:cover; object-position:center;
    background-image: var(--hero-photo);
    background-size:cover; background-position:center;
    animation: kenburns 20s ease-in-out infinite alternate;
  }
  @keyframes kenburns{ from{ transform:scale(1); } to{ transform:scale(1.09); } }

  .hero-ring-a, .hero-ring-b{
    position:absolute; bottom:14%; left:50%; width:min(130px, 32vw); height:auto; z-index:-1; display:block;
    transition: transform 2.2s cubic-bezier(.22,.61,.36,1), opacity 1.3s ease;
    opacity:0;
    filter: drop-shadow(0 0 0 rgba(194,152,74,0));
  }
  .hero-ring-a{ transform: translateX(-50%) translateX(-280px) rotate(-25deg); }
  .hero-ring-b{ transform: translateX(-50%) translateX(280px) rotate(25deg); }
  .hero.reveal-motion .hero-ring-a{
    opacity:1; transform: translateX(-50%) translateX(-22px) rotate(0deg);
    animation: ring-glow-pulse 1.6s ease-out 2.15s forwards;
  }
  .hero.reveal-motion .hero-ring-b{
    opacity:1; transform: translateX(-50%) translateX(22px) rotate(0deg);
    animation: ring-glow-pulse 1.6s ease-out 2.15s forwards;
  }
  @keyframes ring-glow-pulse{
    0%{ filter: drop-shadow(0 0 0 rgba(194,152,74,0)) brightness(1); }
    35%{ filter: drop-shadow(0 0 26px rgba(194,152,74,1)) brightness(1.7); }
    100%{ filter: drop-shadow(0 0 11px rgba(194,152,74,0.6)) brightness(1); }
  }
  .hero-moon{
    position:absolute; top:9%; right:14%; width:64px; height:64px; z-index:-1;
    border-radius:50%;
    background: radial-gradient(circle, var(--gold-bright), rgba(194,152,74,0.15) 60%, transparent 75%);
    filter: blur(1.5px);
  }
  .hero-florals{ position:absolute; top:-8px; right:-8px; width:170px; height:190px; z-index:-1; }
  .hero-sparkle-field{ position:absolute; inset:0; z-index:-1; pointer-events:none; }
  .hero-twinkle{
    position:absolute; width:3px; height:3px; border-radius:50%;
    background:var(--gold-bright); box-shadow:0 0 7px 2px rgba(194,152,74,0.55);
    animation: hero-twinkle-pulse 2.6s ease-in-out infinite;
  }
  @keyframes hero-twinkle-pulse{ 0%,100%{ opacity:0.15; transform:scale(0.8); } 50%{ opacity:1; transform:scale(1.15); } }

  .hero-tint{
    position:absolute; inset:0; z-index:0;
    background: linear-gradient(180deg, rgba(6,8,7,0.4) 0%, rgba(6,8,7,0.08) 32%, rgba(6,8,7,0.3) 66%, rgba(6,8,7,0.68) 100%);
  }
  .hero .wrap{ position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; }

  .monogram{
    position:relative; width:172px; margin:0 auto 18px;
    opacity:0; transform: scale(0.55) rotate(-6deg);
    transition: opacity 1.6s ease, transform 2.4s cubic-bezier(.16,.84,.44,1);
  }
  .hero.reveal-motion .monogram{ opacity:1; transform:scale(1) rotate(0deg); }
  .monogram svg{ width:100%; height:auto; display:block; }
  .monogram .sparkle{ animation: gem-shine 2.6s ease-in-out infinite; transform-origin:center; }
  .monogram .sparkle.s2{ animation-delay: .9s; }
  @keyframes gem-shine{ 0%,100%{ opacity:0.55; transform:scale(0.9); } 50%{ opacity:1; transform:scale(1.05); } }

  .hero-names-script{
    font-family:var(--script); font-weight:400;
    font-size:clamp(56px, 13vw, 108px);
    line-height:1.15;
    color:var(--ivory);
    text-shadow: 0 2px 20px rgba(0,0,0,0.5);
    opacity:0; filter:blur(10px); transform:scale(1.32) translateY(14px);
    transition: opacity 1.8s ease .5s, transform 2.6s cubic-bezier(.16,.84,.44,1) .5s;
  }
  .hero.reveal-motion .hero-names-script{
    opacity:1; transform:scale(1) translateY(0);
    animation: name-glow-pulse 2.2s ease-out .5s forwards;
  }
  @keyframes name-glow-pulse{
    0%{ filter: blur(10px) drop-shadow(0 0 0 rgba(194,152,74,0)); }
    55%{ filter: blur(0) drop-shadow(0 0 24px rgba(194,152,74,0.9)); }
    100%{ filter: blur(0) drop-shadow(0 0 8px rgba(194,152,74,0.3)); }
  }
  .hero-names-script .amp-script{
    font-family:var(--sans); font-size:0.34em; vertical-align:0.3em;
    color:var(--gold-bright); margin:0 10px; letter-spacing:0.1em;
  }
  .hero-names-script .cap{
    font-family:'Fraunces', serif; font-style:italic; font-weight:500;
    font-size:0.86em;
  }

  @media (prefers-reduced-motion: reduce){
    .hero-photo{ animation:none !important; }
    .monogram,.hero-names-script,.scroll-cue,.reveal,.flash-in,.env-box,.env-card,.curtain-panel,.hero-twinkle,.hero-ring-a,.hero-ring-b{ transition:none !important; opacity:1 !important; transform:none !important; filter:none !important; animation:none !important; }
    #confettiField{ display:none !important; }
  }

  .scroll-cue{
    margin-top:34px; font-size:12px; color:var(--ivory-dim); letter-spacing:0.1em; display:flex; align-items:center; gap:10px;
    opacity:0; transition: opacity .8s ease .95s;
  }
  .hero.reveal-motion .scroll-cue{ opacity:1; }
  .scroll-cue .ln{ width:28px; height:1px; background:var(--gold); display:inline-block; }

  /* ---------- Reveal on scroll ---------- */
  .reveal{ opacity:0; transform:translateY(22px); transition:opacity .8s ease, transform .8s ease; }
  .reveal.in{ opacity:1; transform:translateY(0); }

  /* ---------- Flash-in: for titles, kickers, and gold/bold standout text ---------- */
  .flash-in{
    opacity:0; transform:translateY(14px);
    transition: opacity .7s ease, transform .7s ease;
  }
  .flash-in.in{
    opacity:1; transform:translateY(0);
    animation: flash-glow 1.3s ease-out;
  }
  @keyframes flash-glow{
    0%{ filter: brightness(1) drop-shadow(0 0 0 rgba(194,152,74,0)); }
    40%{ filter: brightness(1.3) drop-shadow(0 0 12px rgba(194,152,74,0.55)); }
    100%{ filter: brightness(1) drop-shadow(0 0 0 rgba(194,152,74,0)); }
  }

  /* ---------- Invitation statement ---------- */
  .intro{ position:relative; z-index:0; padding:110px 0; background:var(--canvas); text-align:center; }
  .bismillah{
    font-family:'Amiri', serif; font-size:clamp(24px,4vw,34px);
    color:var(--gold); margin-bottom:20px; line-height:1.9;
  }
  .verse-arabic{
    font-family:'Amiri', serif; font-size:clamp(22px,3.4vw,30px);
    color:var(--gold); margin-bottom:10px;
  }
  .verse-translation{
    font-style:italic; font-size:14.5px; color:var(--text-dark-dim);
    letter-spacing:0.03em; margin-bottom:40px;
  }
  .dear-guests{
    font-family:var(--script); font-weight:400;
    font-size:clamp(38px,6.5vw,58px); color:var(--text-dark);
    margin-bottom:26px;
  }
  .intro p{ font-family:var(--serif); font-size:clamp(18px,2.3vw,22px); line-height:1.85; max-width:600px; margin:0 auto 28px; color:var(--text-dark-dim); font-weight:300; }
  .invite-names-stack{ margin-bottom:30px; }
  .invite-names-big{
    font-family:var(--serif); font-style:italic; font-weight:500;
    font-size:clamp(30px,5vw,48px); color:var(--gold);
    line-height:1.3;
  }
  .invite-amp{
    font-family:var(--script); font-weight:400;
    font-size:clamp(22px,3.4vw,32px); color:var(--gold);
    line-height:1.4;
  }

  /* ---------- Save the date ---------- */
  .save-date{ position:relative; z-index:0; padding:100px 0; background:var(--canvas); text-align:center; }
  .save-date .kicker{ font-size:13px; color:var(--gold); letter-spacing:0.12em; margin-bottom:18px; }
  .cal-month{ font-family:var(--serif); font-size:clamp(28px,4.4vw,42px); color:var(--text-dark); margin-bottom:34px; }
  .cal-month .cal-year{ font-style:italic; color:var(--gold); }
  .cal-grid{
    display:grid; grid-template-columns:repeat(7,1fr); gap:6px;
    max-width:400px; margin:0 auto;
  }
  .cal-wd{ font-size:11px; letter-spacing:0.06em; color:var(--gold); padding-bottom:10px; }
  .cal-cell{
    aspect-ratio:1; display:flex; align-items:center; justify-content:center;
    font-family:var(--serif); font-size:14px; color:var(--text-dark-dim); border-radius:50%;
  }
  .cal-cell.empty{ visibility:hidden; }
  .cal-cell.highlight{ background:var(--gold); color:var(--canvas); font-weight:600; }
  .cal-legend{ margin-top:38px; display:flex; flex-direction:column; gap:12px; align-items:center; }
  .legend-item{ font-size:14.5px; color:var(--text-dark-dim); display:flex; align-items:center; gap:10px; }
  .legend-item .dot{ width:8px; height:8px; border-radius:50%; background:var(--gold); display:inline-block; flex-shrink:0; }

  /* ---------- Events ---------- */
  .events{ padding: 40px 0 60px; }
  .events-intro{ font-family:var(--serif); font-style:italic; font-size:clamp(20px,2.6vw,26px); color:var(--text-dark); text-align:center; margin-bottom:34px; }
  .event-card{
    position:relative;
    background: var(--ink);
    border:1px solid var(--line); border-radius:2px; overflow:hidden; margin: 0 0 26px;
  }
  .corner-orn{ position:absolute; width:30px; height:30px; z-index:5; pointer-events:none; opacity:0.85; }
  .corner-orn.tl{ top:8px; left:8px; }
  .corner-orn.tr{ top:8px; right:8px; transform:scaleX(-1); }
  .corner-orn.bl{ bottom:8px; left:8px; transform:scaleY(-1); }
  .corner-orn.br{ bottom:8px; right:8px; transform:scale(-1,-1); }
  .corner-orn svg{ width:100%; height:100%; display:block; }
  .event-top{
    display:grid; grid-template-columns: 0.9fr 1.4fr; gap:0;
  }
  .event-card .panel-a{
    padding:44px 38px; display:flex; flex-direction:column; justify-content:center; gap:14px;
    position:relative;
  }
  .event-card .panel-b{
    padding:44px 38px; display:flex; flex-direction:column; justify-content:center; gap:18px;
    background: rgba(24,60,42,0.42);
  }
  .event-card.nikkah .panel-a{ background: linear-gradient(160deg, var(--navy), var(--navy-2)); }
  .event-card.mehndi .panel-a{ background: linear-gradient(160deg, var(--burgundy), var(--burgundy-2)); }
  .event-card.wedding .panel-a{ background: linear-gradient(160deg, var(--plum), var(--plum-2)); }

  .route-block{ padding:32px 38px; border-top:1px solid var(--line); background:rgba(20,70,45,0.1); }
  .route-kicker{ font-size:12px; letter-spacing:0.1em; color:var(--gold-bright); margin-bottom:20px; }
  .route-info{ font-size:14px; color:var(--ivory-dim); margin:-8px 0 22px; max-width:420px; line-height:1.6; }
  .route-steps{ display:flex; flex-direction:column; gap:0; }
  .route-step{ display:flex; gap:14px; align-items:flex-start; }
  .route-step .dot{ width:10px; height:10px; border-radius:50%; background:var(--gold); margin-top:6px; flex-shrink:0; }
  .route-step .rs-label{ font-family:var(--serif); font-size:16px; color:var(--ivory); }
  .route-step .rs-addr{ font-size:12.5px; color:var(--ivory-dim); line-height:1.5; margin-top:2px; }
  .route-arrow{ margin:2px 0 2px 4px; color:var(--gold); font-size:15px; line-height:1; opacity:0.85; }
  .route-btns{ display:flex; gap:14px; flex-wrap:wrap; margin-top:26px; }
  .route-btn{
    display:inline-flex; align-items:center; gap:8px; padding:12px 22px;
    border:1px solid var(--gold); border-radius:20px; color:var(--gold-bright); text-decoration:none;
    font-size:13px; transition:all .2s ease;
  }
  .route-btn:hover{ background:var(--gold); color:var(--ink); }

  .itinerary-block{ padding:36px 38px 32px; border-top:1px solid var(--line); }
  .itinerary-kicker{ font-size:12px; letter-spacing:0.1em; color:var(--gold-bright); margin-bottom:24px; }
  .itin-main{ display:flex; flex-direction:column; }
  .itin-row{ display:grid; grid-template-columns:78px 20px 1fr; align-items:start; }
  .itin-time{ font-family:var(--serif); font-size:17px; color:var(--gold-bright); padding-top:1px; }
  .itin-track{ position:relative; display:flex; justify-content:center; align-self:stretch; }
  .itin-dot{ width:11px; height:11px; border-radius:50%; background:var(--gold); margin-top:6px; flex-shrink:0; }
  .itin-track::before{ content:''; position:absolute; top:22px; bottom:-6px; width:1px; background:var(--line); left:50%; }
  .itin-row:last-child .itin-track::before{ display:none; }
  .itin-label{ font-size:16.5px; color:var(--ivory); padding:2px 0 26px; }
  .itin-row:last-child .itin-label{ padding-bottom:0; }

  .itin-after{ margin-top:30px; padding-top:24px; border-top:1px solid var(--line); }
  .itin-after-label{ font-size:11px; letter-spacing:0.1em; color:var(--gold-bright); display:block; margin-bottom:10px; }
  .itin-after-list{ font-size:13.5px; color:var(--ivory-dim); line-height:1.9; }
  .itin-after-list .sep{ color:var(--line); margin:0 8px; }

  .itin-note{ margin-top:22px; font-size:14.5px; color:var(--gold-bright); font-style:italic; }

  .event-tag{ font-size:12px; letter-spacing:0.12em; color:var(--gold-bright); }
  .event-title{ font-size:clamp(28px,3.6vw,42px); color:var(--ivory); }
  .event-note{ font-size:14px; color:var(--ivory-dim); max-width:280px; line-height:1.6; }

  .event-field{ display:flex; flex-direction:column; gap:4px; }
  .event-field .f-lbl{ font-size:11px; letter-spacing:0.1em; color:var(--gold-bright); }
  .event-field .f-val{ font-family:var(--serif); font-size:19px; color:var(--ivory); }
  .event-field .f-sub{ font-size:13px; color:var(--ivory-dim); }

  .cal-link{
    display:inline-flex; align-items:center; gap:8px; margin-top:6px;
    font-size:13px; color:var(--gold-bright); text-decoration:none; border-bottom:1px solid var(--line); padding-bottom:2px; width:fit-content;
  }
  .cal-link:hover{ color:var(--gold); border-color:var(--gold); }

  @media (max-width: 760px){
    .event-top{ grid-template-columns: 1fr; }
  }

  /* ---------- Details ---------- */
  .details{ padding:90px 0 40px; }
  .details-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:28px; margin-top:44px; }
  .detail-box{ border-top:1px solid var(--line); padding-top:20px; }
  .detail-box h3{ font-size:20px; color:var(--gold-bright); margin-bottom:10px; font-weight:400; }
  .detail-box p{ font-size:14.5px; line-height:1.7; color:var(--ivory-dim); }
  @media (max-width:700px){ .details-grid{ grid-template-columns:1fr; } }

  /* ---------- Gallery ---------- */
  .gallery{ padding:90px 0; }
  .gallery-grid{
    display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-top:40px;
  }
  .g-tile{
    aspect-ratio:3/4; border:1px solid var(--line); border-radius:2px;
    display:flex; align-items:center; justify-content:center;
    background: linear-gradient(145deg, rgba(139,107,40,0.06), rgba(255,255,255,0.02));
    color:var(--ivory-dim); font-size:12px; text-align:center; padding:10px;
  }
  .g-tile:nth-child(3n+1){ background: linear-gradient(145deg, rgba(30,69,54,0.35), rgba(255,255,255,0.02)); }
  .g-tile:nth-child(3n+2){ background: linear-gradient(145deg, rgba(99,31,44,0.30), rgba(255,255,255,0.02)); }
  @media (max-width:760px){ .gallery-grid{ grid-template-columns:repeat(2,1fr); } }

  /* ---------- RSVP ---------- */
  .rsvp{ position:relative; z-index:0; padding:90px 0 60px; }
  .rsvp .kicker{ font-size:13px; color:var(--gold); letter-spacing:0.12em; }
  .rsvp-card{
    border:1px solid var(--line); border-radius:2px; padding:44px 36px;
    background: linear-gradient(155deg, var(--emerald), var(--ink));
    color: var(--ivory);
    max-width:720px;
  }
  .rsvp-event-row{ display:flex; justify-content:space-between; align-items:center; padding:16px 0; border-bottom:1px solid var(--line); gap:16px; flex-wrap:wrap; }
  .rsvp-event-row .name{ font-family:var(--serif); font-size:19px; color:var(--gold-bright); }
  .toggle-group{ display:flex; gap:8px; }
  .toggle{
    padding:8px 18px; border:1px solid var(--line); border-radius:20px; background:transparent; color:var(--ivory-dim);
    font-family:var(--sans); font-size:13px; cursor:pointer; transition:all .2s ease;
  }
  .toggle.active-yes{ background:var(--gold); color:var(--ink); border-color:var(--gold); }
  .toggle.active-no{ background:rgba(139,107,40,0.12); color:var(--gold-bright); border-color:var(--gold); }

  .form-row{ margin-top:22px; display:flex; flex-direction:column; gap:8px; }
  .form-row label{ font-size:11px; letter-spacing:0.1em; color:var(--gold-bright); }
  .form-row input, .form-row textarea, .form-row select{
    background:transparent; border:none; border-bottom:1px solid var(--line);
    color:var(--ivory); font-family:var(--sans); font-size:16px; padding:8px 2px; outline:none;
  }
  .form-row input:focus, .form-row textarea:focus, .form-row select:focus{ border-color:var(--gold); }
  .form-row select option{ background:var(--ink); color:var(--ivory); }
  .form-two{ display:grid; grid-template-columns:1fr 1fr; gap:22px; }

  /* ---------- Envelope gate ---------- */
  #app{ position:relative; z-index:2; isolation:isolate; transition: opacity 1.1s ease .35s; }

  #envelopeGate{
    position:fixed; inset:0; z-index:500; background:var(--canvas);

    cursor:pointer; overflow:hidden; perspective:1400px;
    transition: opacity 1.3s ease, visibility 1.3s ease;

  #envelopeGate.fading{ opacity:0; visibility:hidden; pointer-events:none; }

  #envelopeGate::before{
    content:''; position:absolute; inset:0; pointer-events:none;
    background: radial-gradient(circle at 50% 55%, rgba(194,152,74,0) 0%, transparent 60%);
    opacity:0; transition: opacity 1.6s ease, background 1.6s ease;
  }
  #envelopeGate.opening::before{
    opacity:1;
    background: radial-gradient(circle at 50% 55%, rgba(194,152,74,0.38) 0%, transparent 66%);
  }

  .env-shimmer{
    position:absolute; left:0; top:-30%; width:100%; height:30%;
    background: linear-gradient(180deg,
      transparent 0%,
      rgba(194,152,74,0.32) 32%,
      rgba(230,200,140,0.75) 50%,
      rgba(194,152,74,0.32) 68%,
      transparent 100%);
    opacity:0; pointer-events:none;
    filter: blur(3px);
  }
  #envelopeGate.opening .env-shimmer{ animation: shimmer-sweep 1.9s ease forwards; }
  @keyframes shimmer-sweep{ 0%{ top:130%; opacity:0; } 12%{ opacity:1; } 88%{ opacity:1; } 100%{ top:-30%; opacity:0; } }

  .env-box{
    position:relative; width:min(300px, 78vw); height:min(210px, 55vw);
    transform-style: preserve-3d; transition: transform 2s cubic-bezier(.65,0,.35,1);
  }
  #envelopeGate.opening .env-box{ transform: rotateX(6deg) rotateY(-4deg); }

  .env-card{
    position:absolute; left:50%; top:50%; width:76%; height:66%;

    border-radius:2px;

  .env-seal-wrap{

  .env-seal-half{

  .env-seal-half.left{ clip-path: inset(0 33px 0 0); }
  .env-seal-half.right{ clip-path: inset(0 0 0 33px); }
  #envelopeGate.cracking .env-seal-half.left,
  #envelopeGate.opening .env-seal-half.left{ transform: translate(-22px,10px) rotate(-30deg); opacity:0; }
  #envelopeGate.cracking .env-seal-half.right,

  .env-sparkles{ position:absolute; top:56%; left:50%; width:0; height:0; z-index:5; }
  .spark{
    position:absolute; top:0; left:0; width:4px; height:4px; margin:-2px; border-radius:50%;
    background:var(--gold); box-shadow:0 0 6px 1px var(--gold);
    opacity:1; transform:translate(0,0); animation: spark-fly .85s ease-out forwards;
  }
  @keyframes spark-fly{ to{ transform: translate(var(--dx), var(--dy)) scale(0.2); opacity:0; } }

  .env-prompt{
    margin-top:30px; font-size:12px; letter-spacing:0.16em; color:var(--gold);
    transition:opacity .3s ease;
  }
  #envelopeGate.cracking .env-prompt,
  #envelopeGate.opening .env-prompt{ opacity:0; }

  /* ---------- Curtain reveal ---------- */
  #curtainGate{
    position:fixed; inset:0; z-index:480; perspective:1600px;
    pointer-events:none;
  }
  .curtain-panel{
    position:absolute; top:0; bottom:0; width:54%;
    background:
      linear-gradient(90deg,
        rgba(0,0,0,0.22) 0%, transparent 11%,
        transparent 23%, rgba(0,0,0,0.16) 33%,
        transparent 45%, transparent 57%,
        rgba(0,0,0,0.18) 67%, transparent 79%,
        transparent 90%, rgba(0,0,0,0.14) 100%),
      linear-gradient(180deg, var(--gold-bright) 0%, var(--gold) 55%, #7a5c26 100%);
    box-shadow: inset 0 0 130px rgba(0,0,0,0.5);
    border-radius: 0 0 70px 30px;
    transition: transform 3.6s cubic-bezier(.65,0,.35,1);
  }
  .curtain-panel::before{
    content:''; position:absolute; inset:0;
    background: linear-gradient(180deg, rgba(0,0,0,0.45), transparent 15%, transparent 85%, rgba(0,0,0,0.4));
    pointer-events:none;
  }
  .curtain-left{ left:0; border-radius:0 0 30px 70px; transform-origin: 0% 0%; transform: translateX(0) skewX(0deg); }
  .curtain-right{ right:0; transform-origin: 100% 0%; transform: translateX(0) skewX(0deg); }
  #curtainGate.opening .curtain-left{ transform: translateX(-115%) skewX(-24deg); }
  #curtainGate.opening .curtain-right{ transform: translateX(115%) skewX(24deg); }
  .curtain-seam{
    position:absolute; top:0; bottom:0; left:50%; width:6px; margin-left:-3px; z-index:2;
    background: linear-gradient(90deg, transparent, var(--gold-bright), transparent);
    opacity:0.9; transition: opacity 0.35s ease;
  }
  #curtainGate.opening .curtain-seam{ opacity:0; }
</style>

/* =========================================================

function buildCalendarGrid(){
  const daysInMonth = 31;
  const firstWeekday = 4; // October 1, 2026 is a Thursday (Sun=0 ... Sat=6)
  const weekdayLabels = ['S','M','T','W','T','F','S'];
  const headerCells = weekdayLabels.map(l => `<div class="cal-wd">${l}</div>`).join('');
  let cells = '';
  for(let i = 0; i < firstWeekday; i++) cells += `<div class="cal-cell empty"></div>`;
  for(let day = 1; day <= daysInMonth; day++){
    const isHighlighted = allowed.some(k => CONFIG.events[k].day === day);
    cells += `<div class="cal-cell ${isHighlighted ? 'highlight' : ''}">${day}</div>`;
  }
  return headerCells + cells;
}

function archMotif(color){
  color = color || 'var(--gold)';
  return `<svg class="arch-motif" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M4 58V30C4 15 16 4 32 4C48 4 60 15 60 30V58" stroke="${color}" stroke-width="1"/>

    <circle cx="32" cy="30" r="3" stroke="${color}" stroke-width="1" opacity="0.7"/>
  </svg>`;
}

function paisleyDivider(color){

}

}

function heroMandap(){
  const ringA = `<svg class="hero-ring-a" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
    <circle cx="80" cy="90" r="42" fill="none" stroke="var(--gold)" stroke-width="9"/>
  </svg>`;

  const ringB = `<svg class="hero-ring-b" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
    <circle cx="80" cy="94" r="42" fill="none" stroke="var(--gold)" stroke-width="9"/>
    <path d="M64 40 L96 40 L108 56 L80 92 L52 56 Z" fill="none" stroke="var(--gold-bright)" stroke-width="2.2"/>
    <path d="M64 40 L80 92 M96 40 L80 92 M52 56 L108 56" stroke="var(--gold-bright)" stroke-width="1" opacity="0.7"/>
    <circle cx="80" cy="60" r="2.6" fill="var(--gold-bright)" opacity="0.9"/>
  </svg>`;

  const moon = `<div class="hero-moon"></div>`;

  const bloom = (x,y,r,s,c) => `<g transform="translate(${x},${y}) rotate(${r}) scale(${s})" opacity="${c}">
    <circle r="6" fill="var(--burgundy-2)"/>
    <circle cx="-8" cy="4" r="4" fill="var(--burgundy-2)"/>
    <circle cx="8" cy="4" r="4" fill="var(--burgundy-2)"/>
    <circle cx="0" cy="10" r="4" fill="var(--burgundy-2)"/>
  </g>`;
  const florals = `<svg class="hero-florals" viewBox="0 0 200 220" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M195 0 C 150 22 108 32 78 62 C 52 88 38 118 28 195" stroke="var(--burgundy-2)" stroke-width="1.4" opacity="0.55"/>
    ${bloom(150,15,10,1,0.85)}
    ${bloom(118,38,-20,0.85,0.65)}
    ${bloom(82,62,30,0.95,0.75)}
    ${bloom(52,92,-15,0.75,0.55)}
    ${bloom(34,132,20,0.8,0.6)}
    ${bloom(26,172,-10,0.65,0.45)}
  </svg>`;

  const seededRand = (seed) => { const x = Math.sin(seed * 9973.1) * 43758.5453; return x - Math.floor(x); };
  const twinkles = `<div class="hero-sparkle-field">${Array.from({length: 48}).map((_, i) => {
    const r1 = seededRand(i + 1);
    const r2 = seededRand(i + 51);
    const r3 = seededRand(i + 101);
    const r4 = seededRand(i + 151);
    const sizeRoll = r3;
    const size = sizeRoll < 0.55 ? 1.4 + r4 * 0.8 : (sizeRoll < 0.85 ? 2.3 + r4 * 0.9 : 3.2 + r4 * 1.1);
    const isGold = sizeRoll >= 0.85;
    const color = isGold ? 'var(--gold-bright)' : '#f2ead8';
    const glow = isGold ? `0 0 ${5 + size}px ${size * 0.6}px rgba(194,152,74,0.6)` : `0 0 ${3 + size}px ${size * 0.4}px rgba(242,234,216,0.5)`;

  }).join('')}</div>`;

  return ringA + ringB + moon + florals + twinkles;
}

    <path d="M90 90 C 78 96 68 102 62 112" stroke="${color}" stroke-width="1.1" opacity="0.4"/>
    ${leaf(150,30,20,1,0.7)}

function initConfetti(){

  field.id = 'confettiField';
  const colors = ['var(--gold)', 'var(--gold-bright)', 'var(--burgundy-2)', 'var(--emerald)'];
  const shapes = ['rect', 'circle', 'strip'];
  const n = 26;
  for(let i = 0; i < n; i++){
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    const duration = 9 + Math.random() * 9;
    const delay = -(Math.random() * duration);
    const flipDur = 1.1 + Math.random() * 1.6;
    const sway = 25 + Math.random() * 50;
    const color = colors[Math.floor(Math.random() * colors.length)];
    const shape = shapes[Math.floor(Math.random() * shapes.length)];
    let w, h, radius = '1px';
    if(shape === 'circle'){ w = h = 6 + Math.random() * 5; radius = '50%'; }
    else if(shape === 'strip'){ w = 4 + Math.random() * 3; h = 14 + Math.random() * 10; }
    else { w = 7 + Math.random() * 6; h = 7 + Math.random() * 6; }

    piece.style.left = (Math.random() * 100) + '%';
    piece.style.width = w + 'px';
    piece.style.height = h + 'px';
    piece.style.setProperty('--dur', duration + 's');
    piece.style.setProperty('--delay', delay + 's');
    piece.style.setProperty('--flipdur', flipDur + 's');
    piece.style.setProperty('--sway', sway + 'px');

    const inner = document.createElement('div');
    inner.className = 'cf-inner';
    inner.style.background = color;
    inner.style.borderRadius = radius;
    piece.appendChild(inner);
    field.appendChild(piece);
  }
  document.body.appendChild(field);
}

/* =========================================================

const rsvpChoices = {};
function setRsvpChoice(key, val){
  rsvpChoices[key] = val;
  const group = document.querySelector(`.toggle-group[data-group="${key}"]`);
  if(!group) return;
  group.querySelectorAll('.toggle').forEach(btn => {
    btn.classList.remove('active-yes','active-no');
    if(btn.dataset.val === val){
      btn.classList.add(val === 'yes' ? 'active-yes' : 'active-no');
    }
  });
}

async function submitRsvp(){
  const out = document.getElementById('rsvpMsgOut');
  const name = document.getElementById('rsvpName').value.trim();
  const count = document.getElementById('rsvpCount').value;

  if(!name){ out.textContent = 'Please add your name.'; return; }
  if(allowed.some(k => !rsvpChoices[k])){ out.textContent = 'Please respond to each event above.'; return; }

  const btn = document.getElementById('rsvpSubmit');
  btn.disabled = true;
  out.textContent = 'Opening WhatsApp...';

  const record = {
    id: 'rsvp_' + Date.now() + '_' + Math.random().toString(36).slice(2,8),
    name, count,
    responses: {...rsvpChoices},
    invCode: invParam,
    submittedAt: new Date().toISOString()
  };

  // Best-effort backup log for the admin dashboard — does not block sending the WhatsApp message
  try{
    await window.storage.set('rsvp:' + record.id, JSON.stringify(record), true);
  }catch(err){ /* non-blocking */ }

  const lines = [`RSVP from ${name}`, ''];
  allowed.forEach(k => {
    const label = CONFIG.events[k].tag;
    const resp = rsvpChoices[k] === 'yes' ? 'Attending' : 'Not attending';
    lines.push(`${label}: ${resp}`);
  });
  lines.push('');
  lines.push(`Number attending: ${count}`);
  const message = lines.join('\n');
  const waUrl = `https://wa.me/447805429299?text=${encodeURIComponent(message)}`;

  window.open(waUrl, '_blank');
  showThanks();
}

  const area = document.getElementById('rsvpArea');
  area.innerHTML = `

/* =========================================================
   Calendar link helper
   ========================================================= */
function scriptName(name){
  return `<span class="cap">${name.charAt(0)}</span>${name.slice(1)}`;
}

function icsEscape(s){
  return String(s || '').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
}
function toICSDate(dateStr){
  const d = new Date(dateStr);
  const pad = n => n < 10 ? '0'+n : ''+n;
  return d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()) + 'T' + pad(d.getHours()) + pad(d.getMinutes()) + '00';
}
function buildICSContent(e){
  const loc = e.city ? `${e.venue}, ${e.city}` : e.venue;
  const end = e.end || e.date;
  const lines = [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//Shezan and Anam Wedding//EN',
    'BEGIN:VEVENT',
    'UID:' + e.key + '-' + Date.now() + '@wedding',
    'DTSTAMP:' + toICSDate(new Date().toISOString()),
    'DTSTART:' + toICSDate(e.date),
    'DTEND:' + toICSDate(end),
    'SUMMARY:' + icsEscape(e.title),
    'LOCATION:' + icsEscape(loc),
    'DESCRIPTION:' + icsEscape(e.note || ''),
    'END:VEVENT',
    'END:VCALENDAR'
  ];
  return lines.join('\r\n');
}

function downloadICS(eventKey){
  const e = CONFIG.events[eventKey];
  if(!e || !e.date) return;
  try{
    const content = buildICSContent(e);
    const blob = new Blob([content], { type: 'text/calendar;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = eventKey + '.ics';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }catch(err){
    console.error(err);
  }
}

function buildRouteLink(route){
  if(!route || route.length < 1) return null;
  const enc = s => encodeURIComponent(s);
  const destination = enc(route[route.length-1].address);
  const mid = route.slice(0,-1).map(r => enc(r.address)).join('|');
  let url = `https://www.google.com/maps/dir/?api=1&destination=${destination}&travelmode=driving`;
  if(mid) url += `&waypoints=${mid}`;
  return url;
}

/* =========================================================
   Scroll reveal + progress bar
   ========================================================= */
function initCountdown(){
  const display = document.getElementById('countdownDisplay');
  if(!display) return;
  const w = CONFIG.events.wedding;
  // Anchored to UK time (BST, UTC+1 in October) so the countdown is accurate
  // for guests viewing from any timezone, not just the viewer's local clock.
  const targetStr = w.date ? `${w.date}+01:00` : `2026-10-${String(w.day).padStart(2,'0')}T00:00:00+01:00`;
  const target = new Date(targetStr).getTime();
  let timer;

  function render(){
    const now = Date.now();
    const diff = target - now;
    if(diff <= 0){
      display.innerHTML = `<div class="countdown-arrived">The day has arrived!</div>`;
      clearInterval(timer);
      return;
    }
    const d = Math.floor(diff / 86400000);
    const h = Math.floor((diff % 86400000) / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);
    display.innerHTML = `
      <div class="countdown-row">
        <div class="countdown-unit"><div class="countdown-num">${d}</div><div class="countdown-label">DAYS</div></div>
        <div class="countdown-unit"><div class="countdown-num">${String(h).padStart(2,'0')}</div><div class="countdown-label">HOURS</div></div>
        <div class="countdown-unit"><div class="countdown-num">${String(m).padStart(2,'0')}</div><div class="countdown-label">MINS</div></div>
        <div class="countdown-unit"><div class="countdown-num">${String(s).padStart(2,'0')}</div><div class="countdown-label">SECS</div></div>
      </div>`;
  }

  render();
  timer = setInterval(render, 1000);
}

function setupScrollEffects(){
  const bar = document.getElementById('progressBar');
  window.addEventListener('scroll', () => {
    const h = document.documentElement;
    const pct = (h.scrollTop) / (h.scrollHeight - h.clientHeight) * 100;
    bar.style.width = pct + '%';
  });

  const io = new IntersectionObserver((entries) => {
    entries.forEach(en => { if(en.isIntersecting) en.target.classList.add('in'); });
  }, { threshold: 0.15 });
  document.querySelectorAll('.reveal, .flash-in').forEach(el => io.observe(el));
}

        <div class="env-seal-half left">S&amp;A</div>
        <div class="env-seal-half right">S&amp;A</div>
        <div class="env-sparkles" id="envSparkles"></div>
      </div>
    </div>
    <div class="env-prompt">Tap to open</div>
  `;
  overlay.addEventListener('click', openEnvelope, { once: true });
  document.body.appendChild(overlay);
}

function spawnSparkles(){
  const container = document.getElementById('envSparkles');
  if(!container) return;
  const n = 16;
  for(let i = 0; i < n; i++){
    const s = document.createElement('span');
    s.className = 'spark';
    const angle = (Math.PI * 2 * i) / n + (Math.random() * 0.3 - 0.15);
    const dist = 46 + Math.random() * 54;
    s.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
    s.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
    s.style.animationDelay = (Math.random() * 90) + 'ms';
    container.appendChild(s);
  }
}

function openEnvelope(){
  const overlay = document.getElementById('envelopeGate');

  overlay.classList.add('cracking');
  spawnSparkles();

  setTimeout(() => overlay.classList.add('opening'), 500);
  setTimeout(() => overlay.classList.add('fading'), 3400);
  setTimeout(() => {
    overlay.remove();
    showCurtains();
  }, 4700);
}

function showCurtains(){
  const appEl = document.getElementById('app');
  appEl.classList.remove('gated');

  const curtainOverlay = document.createElement('div');
  curtainOverlay.id = 'curtainGate';
  curtainOverlay.innerHTML = `
    <div class="curtain-panel curtain-left"></div>
    <div class="curtain-panel curtain-right"></div>
    <div class="curtain-seam"></div>
  `;
  document.body.appendChild(curtainOverlay);

  setTimeout(() => curtainOverlay.classList.add('opening'), 300);

  setTimeout(() => {
    const heroEl = appEl.querySelector('.hero');
    if (heroEl) heroEl.classList.add('reveal-motion');
  }, 1700);

  setTimeout(() => {
    if(!document.getElementById('confettiField')) initConfetti();
  }, 3600);

  setTimeout(() => curtainOverlay.remove(), 4050);
}

/* =========================================================
   BOOT
   ========================================================= */
if(isAdmin){
  renderAdminLogin();
} else if(allowed.length === 0){
  renderGate();
} else {
  app.classList.add('gated');
  renderSite();
  renderEnvelope();
}
</script>
</body>
